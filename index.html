<style>
  /* ═══════════════════════════════════════════════════════════════
     O sistema visual do casamento, tirado do convite.
     Os mesmos tokens do hub em aboutcollab.github.io/maeli-marieke-wedding
     e do site do ônibus, pra tudo parecer a mesma coisa.
     ═══════════════════════════════════════════════════════════════ */
  :root{
    --paper:#FFFFFF;
    --blush:#F5E7F0;      /* o fundo da página 4 do convite */
    --blush-deep:#F0DAE8;
    --pink:#F81878;       /* o rosa do wordmark, tirado do convite */
    --pink-deep:#C4105E;  /* rosa com contraste pra texto e link */
    --pink-soft:#FBD4E4;
    --ink:#3A3739;
    --ink-soft:#6E686C;
    --line:#EADDE6;
    --plum:#4A2233;       /* o véu por cima da foto da duna */
    --display:"Quicksand", "Century Gothic", sans-serif;
    --corpo:"Open Sans", -apple-system, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
  body{font-family:var(--corpo);color:var(--ink);background:var(--paper);line-height:1.65;font-size:1rem;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  img{max-width:100%;display:block}
  svg{max-width:100%}
  a{color:var(--pink-deep)}
  :focus-visible{outline:3px solid var(--pink);outline-offset:3px;border-radius:6px}

  .wrap{width:100%;max-width:44rem;margin:0 auto;padding:0 1.25rem;position:relative;z-index:2}
  @media (min-width:900px){.wrap{max-width:56rem}}
  section{padding:3.25rem 0;position:relative}
  h2{font-family:var(--display);font-weight:600;font-size:clamp(1.4rem,5vw,1.85rem);letter-spacing:.02em;color:var(--ink);margin:.45rem 0 .5rem}
  .kicker{font-family:var(--display);font-weight:600;font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--pink-deep);display:block}
  .sub{color:var(--ink-soft);max-width:38rem;margin-bottom:1.75rem}
  .display{font-family:var(--display);font-weight:700;letter-spacing:.02em}

  .btn{display:inline-block;font-family:var(--display);font-weight:700;font-size:1.02rem;letter-spacing:.04em;
       background:var(--pink);color:#fff;border-radius:999px;padding:.9rem 2rem;text-decoration:none;
       box-shadow:0 2px 0 rgba(196,16,94,.3)}
  .btn:hover{filter:brightness(1.05)}
  .btn-note{font-size:.86rem;color:var(--ink-soft)}

  /* ---------- as flores de cerejeira do convite ---------- */
  .blossom{position:absolute;pointer-events:none;user-select:none;z-index:0}
  .blossom.tl{top:0;left:0;width:clamp(78px,13vw,200px)}
  .blossom.tr{top:0;right:0;width:clamp(74px,12.5vw,190px)}
  .blossom.bl{bottom:0;left:0;width:clamp(115px,27vw,265px)}
  .blossom.br{bottom:0;right:0;width:clamp(120px,29vw,285px)}

  /* ---------- topo ---------- */
  .topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.93);backdrop-filter:blur(8px);
          border-bottom:1px solid var(--line)}
  .topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding-top:.55rem;padding-bottom:.55rem}
  .topbar img{width:clamp(105px,26vw,150px)}
  .topbar .right{display:flex;align-items:center;gap:.6rem;flex:0 0 auto}
  .topbar .tag{font-family:var(--display);font-weight:600;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;
               color:var(--pink-deep);background:var(--blush);border-radius:999px;padding:.35rem .8rem;flex:0 0 auto;white-space:nowrap;
               display:none}
  /* a tag é identidade, o switch é função: abaixo de 560px o switch fica com o espaço */
  @media (min-width:560px){.topbar .tag{display:inline-block}}
  /* o seletor de idioma, igualzinho ao do hub */
  .switch{display:flex;gap:.2rem;background:var(--blush);border-radius:999px;padding:.2rem;flex:0 0 auto}
  .switch button{font-family:var(--display);font-weight:600;font-size:.74rem;letter-spacing:.08em;
                 border:none;background:none;color:var(--ink-soft);padding:.34rem .6rem;border-radius:999px;cursor:pointer}
  .switch button[aria-current="true"]{background:var(--paper);color:var(--pink-deep);box-shadow:0 1px 2px rgba(0,0,0,.07)}

  /* ---------------- HERO ---------------- */
  /* a foto real da duna holandesa ao pôr do sol continua aqui, com um véu
     cor de ameixa por cima pra letra ficar legível e pra foto conversar
     com o rosa do convite em vez de brigar com ele */
  /* o padding do topo acompanha a altura das flores (largura x 1,41), senão em
     tela de celular a linha "camping crew" nasce debaixo da flor do canto */
  .hero{position:relative;isolation:isolate;color:#fff;padding:clamp(7.25rem,20vw,11rem) 0 4rem;overflow:hidden}
  .hero::before{content:"";position:absolute;inset:0;z-index:-2;
    background-image:url("praia.webp");background-size:cover;background-position:center 62%}
  .hero::after{content:"";position:absolute;inset:0;z-index:-1;
    background:
      linear-gradient(180deg,rgba(255,255,255,0) 78%,rgba(245,231,240,.55) 92%,#F5E7F0 100%),
      linear-gradient(180deg,
        rgba(74,34,51,.86) 0%,
        rgba(74,34,51,.78) 45%,
        rgba(74,34,51,.60) 72%,
        rgba(74,34,51,.32) 90%,
        rgba(74,34,51,.12) 100%)}
  @media (min-width:900px){.hero::before{background-position:center 58%}}
  /* Os PNGs das flores foram recortados do convite e carregam um fundo quase
     branco OPACO em volta dos galhos. Em página branca isso é invisível, é branco
     sobre branco. Em cima da foto escura aparece como um retângulo claro. A máscara
     radial dissolve o sprite a partir do canto antes de chegar na borda reta, então
     as flores entram na foto como uma bruma em vez de uma caixa.
     Só no hero: no rodapé o fundo é branco e não precisa. */
  .hero .blossom{opacity:.92}
  .hero .blossom.tl{-webkit-mask-image:radial-gradient(125% 125% at 0% 0%,#000 42%,rgba(0,0,0,.35) 62%,transparent 76%);
                            mask-image:radial-gradient(125% 125% at 0% 0%,#000 42%,rgba(0,0,0,.35) 62%,transparent 76%)}
  .hero .blossom.tr{-webkit-mask-image:radial-gradient(125% 125% at 100% 0%,#000 42%,rgba(0,0,0,.35) 62%,transparent 76%);
                            mask-image:radial-gradient(125% 125% at 100% 0%,#000 42%,rgba(0,0,0,.35) 62%,transparent 76%)}
  .hero .eyebrow{font-family:var(--display);font-weight:600;font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;
                 color:var(--pink-soft);text-shadow:0 1px 12px rgba(74,34,51,.8)}
  .hero h1{font-family:var(--display);font-weight:600;font-size:clamp(1.6rem,6.2vw,2.35rem);line-height:1.28;letter-spacing:.02em;
           color:#fff;margin:.8rem 0 .9rem;max-width:20ch;text-shadow:0 2px 20px rgba(74,34,51,.6)}
  .hero h1 em{font-style:normal;color:var(--pink-soft)}
  .hero .lede{max-width:38rem;color:#F7EAF1;text-shadow:0 1px 14px rgba(74,34,51,.75)}
  .ticket{display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:.5rem;margin:1.4rem 0 .3rem;
    background:var(--pink);color:#fff;padding:.55rem 1.15rem;border-radius:999px;
    font-family:var(--display);font-weight:700;font-size:clamp(.95rem,3.8vw,1.1rem);letter-spacing:.02em;
    box-shadow:0 2px 0 rgba(196,16,94,.3)}
  .ticket span{font-weight:500;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;opacity:.92}
  .hero-cta{margin:1.5rem 0 .4rem;display:flex;flex-wrap:wrap;gap:.9rem;align-items:center}
  .hero-cta .btn-note{color:#F2DFE9;text-shadow:0 1px 12px rgba(74,34,51,.85)}
  .hero-cta .btn-note b{color:#fff}

  /* ---------------- quem organiza ---------------- */
  .helena{background:var(--blush);padding:2.75rem 0}
  .helena-card{background:var(--paper);border:1.5px solid var(--pink-soft);border-radius:20px;padding:1.4rem 1.25rem;
               display:flex;gap:1rem;align-items:flex-start}
  @media (min-width:640px){.helena-card{padding:1.9rem 1.8rem;gap:1.2rem}}
  .helena-av{flex:0 0 auto;width:48px;height:48px;border-radius:50%;background:var(--blush);color:var(--pink-deep);
    display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.35rem}
  .helena p{color:var(--ink-soft)}
  .helena b{color:var(--ink);font-weight:600}

  /* ---------------- rota ---------------- */
  .rota{list-style:none;margin:1.5rem 0 0;padding:0}
  .rota li{position:relative;padding:0 0 1.9rem 3.4rem}
  .rota li::before{content:"";position:absolute;left:.72rem;top:.55rem;bottom:-.55rem;width:7px;background:var(--pink-soft);border-radius:4px}
  .rota li:last-child{padding-bottom:0}
  .rota li:last-child::before{display:none}
  .rota li::after{content:"";position:absolute;left:.3rem;top:.28rem;width:1.35rem;height:1.35rem;border-radius:50%;
    background:var(--paper);border:6px solid var(--pink-soft)}
  .rota li.areia::before{background:repeating-linear-gradient(180deg,var(--pink) 0 12px,var(--pink-soft) 12px 24px)}
  .rota li.chegada::after{background:var(--pink);border-color:var(--blush-deep)}
  .rota .lugar{font-family:var(--display);font-weight:700;font-size:1.1rem;line-height:1.25;color:var(--ink);display:block}
  .rota .meta{font-family:var(--display);font-weight:600;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;
              color:var(--pink-deep);display:block;margin-top:.2rem}
  .rota .nota{display:block;font-size:.92rem;color:var(--ink-soft);margin-top:.3rem}
  .rota-grid{display:grid;gap:1.5rem}
  @media (min-width:900px){.rota-grid{grid-template-columns:1fr 18rem;gap:2.5rem;align-items:start}}
  .mapinha{background:var(--blush);border-radius:20px;padding:1.35rem}
  .mapinha figcaption{font-family:var(--display);font-weight:600;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;
                      color:var(--pink-deep);margin-top:.7rem;text-align:center}
  .aviso{margin-top:1.75rem;background:var(--blush);border-radius:16px;padding:1.1rem 1.2rem;font-size:.93rem;color:var(--ink-soft)}
  .aviso b{color:var(--ink);font-weight:600}

  /* ---------------- ninguém dirige ---------------- */
  .hop{background:var(--blush);overflow:hidden}
  .hop-cards{display:grid;gap:.9rem;margin-top:.5rem}
  @media (min-width:760px){.hop-cards{grid-template-columns:1fr 1fr}}
  .hop-card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:1.35rem 1.3rem;position:relative}
  .hop-card.principal{border:1.5px solid var(--pink-soft)}
  .hop-card .tag{font-family:var(--display);font-weight:700;font-size:.63rem;letter-spacing:.12em;text-transform:uppercase;
    display:inline-block;padding:.22rem .6rem;border-radius:999px;background:var(--blush-deep);color:var(--pink-deep);margin-bottom:.85rem}
  .hop-card.principal .tag{background:var(--pink);color:#fff}
  .hop-card h3{font-family:var(--display);font-weight:700;font-size:1.15rem;line-height:1.25;margin-bottom:.15rem;color:var(--ink)}
  .hop-preco{font-family:var(--display);font-weight:700;font-size:1.9rem;line-height:1.15;color:var(--pink-deep);margin:.45rem 0 .1rem}
  .hop-card .por{font-family:var(--display);font-weight:600;font-size:.68rem;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft)}
  .hop-card p{font-size:.93rem;margin-top:.8rem;color:var(--ink-soft)}
  .hop-fonte{margin-top:1.3rem;font-size:.84rem;color:var(--ink-soft)}

  /* ---------------- OS 3 DIAS ---------------- */
  .dias{overflow:hidden}
  .fita{display:grid;gap:.7rem;margin-top:1.6rem}
  @media (min-width:860px){.fita{grid-template-columns:1fr 1.2fr 1fr;gap:.8rem}}
  .dia{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:1.4rem 1.3rem;position:relative}
  .dia .data{font-family:var(--display);font-weight:700;font-size:clamp(1.5rem,6vw,1.9rem);line-height:1.15;color:var(--ink)}
  .dia .titulo{font-family:var(--display);font-weight:600;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--pink-deep);margin-top:.35rem}
  .dia ul{list-style:none;margin-top:1.05rem;display:grid;gap:.55rem}
  .dia li{position:relative;padding-left:1.15rem;font-size:.94rem;color:var(--ink-soft)}
  .dia li::before{content:"";position:absolute;left:0;top:.6rem;width:.4rem;height:.4rem;border-radius:50%;background:var(--pink)}
  .dia li b{font-family:var(--display);font-weight:700;font-size:.9rem;color:var(--ink)}
  /* o dia do casamento: o painel do meio vira o rosa do convite */
  .dia.casamento{background:var(--pink-deep);border-color:var(--pink-deep);color:#fff}
  .dia.casamento .data{color:#fff}
  .dia.casamento .titulo{color:var(--pink-soft)}
  .dia.casamento li{color:#FAE7F0}
  .dia.casamento li::before{background:var(--pink-soft)}
  .dia.casamento li b{color:#fff}
  .por-do-sol{margin-top:1.2rem;display:flex;align-items:center;gap:.8rem;border-top:1px solid rgba(255,255,255,.28);padding-top:.9rem}
  .por-do-sol svg{flex:0 0 auto}
  .por-do-sol div{font-size:.88rem;color:#FAE7F0}
  .por-do-sol b{display:block;font-family:var(--display);font-weight:700;font-size:1.2rem;color:#fff;line-height:1.2}
  .fita-legenda{display:grid;gap:.2rem;margin-top:.9rem;font-family:var(--display);font-weight:600;font-size:.66rem;letter-spacing:.13em;
    text-transform:uppercase;color:var(--ink-soft)}
  @media (min-width:860px){.fita-legenda{grid-template-columns:1fr 1.2fr 1fr;gap:.8rem;text-align:center}}

  /* ---------------- vilinha ---------------- */
  .vilinha{background:var(--blush);overflow:hidden}
  .pitches{display:grid;gap:.7rem;margin-top:1.5rem}
  @media (min-width:560px){.pitches{grid-template-columns:1fr 1fr}}
  @media (min-width:900px){.pitches{grid-template-columns:repeat(4,1fr)}}
  .pitch{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:.95rem 1rem}
  .pitch .n{font-family:var(--display);font-weight:600;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--pink-deep)}
  .pitch svg{display:block;margin:.5rem 0 .45rem}
  .pitch .m2{font-family:var(--display);font-weight:700;font-size:1.15rem;color:var(--ink);line-height:1.2}
  .pitch .quem{font-size:.88rem;color:var(--ink-soft)}
  .pitch.mais{border:1.5px dashed var(--pink-soft);display:flex;flex-direction:column;justify-content:center;text-align:center;min-height:6.3rem}
  .pitch.mais .mais-txt{font-family:var(--display);font-weight:700;color:var(--pink-deep);font-size:1rem;line-height:1.25;margin-top:.4rem}
  .banheiro{margin-top:1.1rem;background:var(--paper);border:1.5px solid var(--pink-soft);border-radius:20px;
            padding:1.2rem 1.25rem;display:flex;gap:1rem;align-items:flex-start}
  .banheiro .emoji{font-size:1.7rem;line-height:1.2}
  .banheiro h3{font-family:var(--display);font-weight:700;font-size:1.08rem;line-height:1.3;margin-bottom:.3rem;color:var(--ink)}
  .banheiro p{font-size:.93rem;color:var(--ink-soft)}
  .fatos{display:grid;gap:.6rem;margin-top:1.1rem}
  @media (min-width:640px){.fatos{grid-template-columns:1fr 1fr 1fr}}
  .fato{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:.95rem 1.05rem;font-size:.9rem;color:var(--ink-soft)}
  .fato b{display:block;font-family:var(--display);font-weight:700;font-size:1.02rem;color:var(--ink);margin-bottom:.2rem}
  .regras{margin-top:1.2rem;font-size:.92rem;color:var(--ink-soft)}
  .regras b{color:var(--ink);font-weight:600}

  /* ---------------- custo ---------------- */
  .cards{display:grid;gap:.7rem}
  @media (min-width:560px){.cards{grid-template-columns:1fr 1fr}}
  @media (min-width:900px){.cards{grid-template-columns:repeat(4,1fr)}}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:1.15rem 1.05rem;position:relative}
  .card .valor{font-family:var(--display);font-weight:700;font-size:clamp(1.5rem,6vw,1.8rem);line-height:1.15;color:var(--pink-deep);white-space:nowrap}
  .card .oque{font-family:var(--display);font-weight:700;font-size:1rem;margin-top:.35rem;color:var(--ink)}
  .card .det{font-size:.87rem;color:var(--ink-soft);margin-top:.25rem}
  .est{position:absolute;top:-.55rem;right:.7rem;background:var(--blush-deep);color:var(--pink-deep);
    font-family:var(--display);font-weight:700;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;
    padding:.2rem .55rem;border-radius:999px}
  .total{background:var(--pink-deep);color:#fff;margin-top:.7rem;padding:1.5rem 1.4rem;border-radius:20px;
    display:flex;flex-wrap:wrap;align-items:baseline;gap:.4rem 1rem}
  .total .valor{font-family:var(--display);font-weight:700;font-size:clamp(2.1rem,9vw,2.9rem);line-height:1.1;color:#fff}
  .total .oque{font-family:var(--display);font-weight:600;font-size:1rem;color:var(--pink-soft)}
  .total .det{width:100%;font-size:.92rem;color:#FAE7F0}
  .como-paga{margin-top:1.2rem;background:var(--blush);border-radius:20px;padding:1.3rem 1.25rem;font-size:.94rem;color:var(--ink-soft)}
  .como-paga b{color:var(--ink);font-weight:600}
  .como-paga ul{list-style:none;margin-top:.75rem;display:grid;gap:.5rem}
  .como-paga li{padding-left:1.4rem;position:relative}
  .como-paga li::before{content:"→";position:absolute;left:0;color:var(--pink);font-weight:700}

  /* ---------------- participar ---------------- */
  .passos{list-style:none;counter-reset:p;display:grid;gap:.7rem;margin-top:1.4rem}
  @media (min-width:760px){.passos{grid-template-columns:1fr 1fr}}
  .passos li{counter-increment:p;background:var(--paper);border:1px solid var(--line);border-radius:18px;
             padding:1.05rem 1.1rem 1.05rem 3.6rem;position:relative}
  .passos li::before{content:counter(p);position:absolute;left:1rem;top:1.05rem;width:1.75rem;height:1.75rem;border-radius:50%;
    background:var(--blush);color:var(--pink-deep);font-family:var(--display);font-weight:700;font-size:.95rem;display:grid;place-items:center}
  .passos b{display:block;font-family:var(--display);font-weight:700;color:var(--ink)}
  .passos span{font-size:.92rem;color:var(--ink-soft)}

  .crew{background:var(--blush);overflow:hidden}
  .parede{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:1.4rem}
  /* NÃO renomear .chip nem .chip.vazio nem .contador: o comando /crew-wall
     regenera este bloco e conta com estas classes exatas. */
  .chip{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:.65rem .9rem;min-width:0;max-width:100%}
  .chip .nome{font-family:var(--display);font-weight:700;font-size:1rem;line-height:1.25;color:var(--ink);display:block}
  .chip .badges{font-size:.8rem;color:var(--ink-soft);margin-top:.25rem;display:block;line-height:1.4;overflow-wrap:anywhere}
  .chip.vazio{background:transparent;border:1.5px dashed var(--pink-soft);display:grid;place-items:center;color:var(--pink-deep);
    font-family:var(--display);font-weight:600;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;padding:.75rem .95rem}
  .legenda{margin-top:1.2rem;font-size:.88rem;color:var(--ink-soft)}

  .contador{font-family:var(--display);font-weight:600;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--pink-deep);margin-top:1rem}

  .resposta{padding:1rem 1.1rem;font-size:.94rem;color:var(--ink-soft)}

  .resposta b{color:var(--ink);font-weight:600}

/* ═══════════════════════════════════════════════════════════════════════
   Engine. Igual à do hub, sem o splash: esta página é aberta direto de uma
   mensagem no WhatsApp, então nunca pode colocar uma tela na frente do
   botão de inscrição. O idioma é adivinhado, e daí é só trocar.
   ═══════════════════════════════════════════════════════════════════════ */
const LANGS = ["pt","en","nl"];
const KEY = "mm-lang";          /* a mesma chave que o hub escreve, de propósito */
const FALLBACK = "pt";          /* a turma é brasileira: português é o padrão daqui */

/** Resolve "prices.camp" / "campDates" em FACTS, escolhendo a variante do idioma. */
function fact(path, lang){
  let v = path.split(".").reduce((o,k)=> (o==null ? o : o[k]), FACTS);
  if (v && typeof v === "object" && !Array.isArray(v)) v = v[lang];
  return v == null ? "" : String(v);
}

/** Preenche {placeholders} a partir de FACTS. */
function fill(str, lang){
  return str.replace(/\{([a-zA-Z0-9_.]+)\}/g, (_, p) => fact(p, lang));
}

function t(key, lang){
  const e = COPY[key];
  if (!e) return "";
  return fill(e[lang] ?? e.pt ?? "", lang);
}

/** The copy string with NO {placeholder} filling. Used by the crew wall, whose
    {n} and {d} come from the wall's own attributes, not from FACTS: running
    fill() over them first would blank them out. */
function raw(key, lang){
  const e = COPY[key];
  return e ? (e[lang] ?? e.pt ?? "") : "";
}

/* A parede da camping crew é gerada pelo comando /crew-wall, que escreve
   tokens em data-badges (go, thu, car, car:4, van, vanThu, tent, gear).
   Aqui os tokens viram texto no idioma escolhido, então a parede fala
   português, inglês e holandês sem o comando saber de idioma nenhum. */
function renderCrew(lang){
  document.querySelectorAll("[data-badges]").forEach(el => {
    el.textContent = el.dataset.badges.split(",")
      .map(s => s.trim()).filter(Boolean)
      .map(token => {
        const [name, arg] = token.split(":");
        let out = t("badge." + name, lang);
        if (!out) return "";
        if (name === "car" && arg) out += " " + raw("badge.seats", lang).replace("{n}", arg);
        return out;
      })
      .filter(Boolean).join(" · ");
  });
  document.querySelectorAll(".contador").forEach(el => {
    el.textContent = raw("crew.count", lang)
      .replace("{n}", el.dataset.count || "0")
      .replace("{d}", el.dataset.updated || "");
  });
}

function applyLang(lang){
  if (!LANGS.includes(lang)) lang = FALLBACK;
  document.documentElement.lang = (lang === "pt") ? "pt-BR" : lang;
  document.title = t("meta.title", lang);

  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t(el.dataset.i18n, lang);
  });
  document.querySelectorAll("[data-i18n-html]").forEach(el => {
    el.innerHTML = t(el.dataset.i18nHtml, lang);
  });
  document.querySelectorAll("[data-f]").forEach(el => {
    el.textContent = fact(el.dataset.f, lang);
  });

  renderCrew(lang);
  wireLinks(lang);

  document.querySelectorAll(".switch button").forEach(b => {
    b.setAttribute("aria-current", String(b.dataset.lang === lang));
  });

  try { localStorage.setItem(KEY, lang); } catch(e){}
  const u = new URL(location.href);
  u.searchParams.set("lang", lang);
  history.replaceState(null, "", u);
}

/* Os links fixos, e os que carregam o idioma pra página seguinte.
   Roda depois de cada troca de idioma, porque data-i18n-html reescreve
   o parágrafo que contém o link do ônibus. */
function wireLinks(lang){
  document.querySelectorAll("[data-link]").forEach(el => {
    el.href = FACTS.links[el.dataset.link];
  });
  document.querySelectorAll("[data-langlink]").forEach(el => {
    el.href = FACTS.links[el.dataset.langlink] + "?lang=" + lang;
    el.target = "_blank";
    el.rel = "noopener";
  });
}

/* ?lang= ganha (é assim que o hub entrega o visitante), depois o idioma que a
   pessoa já escolheu, depois o navegador, depois português. */
function pickLang(){
  const q = new URLSearchParams(location.search).get("lang");
  if (q && LANGS.includes(q)) return q;
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch(e){}
  if (saved && LANGS.includes(saved)) return saved;
  const nav = (navigator.language || FALLBACK).slice(0,2).toLowerCase();
  return LANGS.includes(nav) ? nav : FALLBACK;
}

document.addEventListener("DOMContentLoaded", () => {
  applyLang(pickLang());
  document.querySelectorAll(".switch button").forEach(b => {
    b.addEventListener("click", () => applyLang(b.dataset.lang));
  });
});
</script>
</body>
</html>
